# Base comum a dev e prod. Não publica nenhuma porta no host.
#   dev:  docker compose up -d --build                (carrega docker-compose.override.yml sozinho)
#   prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
name: ai-text-secury

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-backend: &backend
  build: ./backend
  image: ai-text-secury-backend:${APP_VERSION:-local}
  env_file:
    - path: .env
      required: false
  environment:
    # Credenciais repetidas aqui para ficarem sempre iguais às do serviço storage
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-secury}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-secury-dev-secret}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-secury}:${POSTGRES_PASSWORD:-secury}@postgres:5432/${POSTGRES_DB:-secury}
    REDIS_URL: redis://redis:6379/0
    # "-" sem ":" mantém o valor vazio do .env (vazio = AWS S3 de verdade)
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://storage:9000}
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    storage:
      condition: service_healthy
      required: false # sem o profile "storage" (usando S3 externo) a dependência é ignorada

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secury}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secury}
      POSTGRES_DB: ${POSTGRES_DB:-secury}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Object storage compatível com S3 (RustFS, Apache 2.0). Substitui o MinIO, cuja imagem
  # oficial saiu do Docker Hub. Para usar S3 gerenciado, tire "storage" de COMPOSE_PROFILES.
  storage:
    image: rustfs/rustfs:1.0.4
    profiles: [storage]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-secury}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-secury-dev-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      # Chave mestra da criptografia em repouso (SSE-S3). Perder a chave = perder os arquivos.
      RUSTFS_SSE_S3_MASTER_KEY: ${STORAGE_SSE_MASTER_KEY:-}
    volumes: [storagedata:/data]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Roda uma vez a cada subida: migrações, catálogo de regras, bucket e API key inicial.
  migrate:
    <<: *backend
    command: sh -c "alembic upgrade head && python -m app.cli setup"
    restart: "no"

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4).status != 200)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  worker:
    <<: *backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=${WORKER_CONCURRENCY:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-http://localhost:8000}
    image: ai-text-secury-web:${APP_VERSION:-local}
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

volumes:
  pgdata:
  redisdata:
  storagedata:
